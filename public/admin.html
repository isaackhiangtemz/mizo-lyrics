<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Mizo Lyrics</title><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="/">Mizo<span>Lyrics</span></a><a href="/">← Site</a></div></header><main class="wrap admin"><section class="admin-head"><p class="eyebrow">ADMIN PANEL</p><h1>Manage songs / Hla enkawl</h1><p>Add, edit or delete songs. Keep the admin key private.</p></section><section class="admin-card"><div class="admin-grid"><label>Admin key<input id="adminKey" type="password" placeholder="ADMIN_KEY"></label><label>Song to edit<select id="songSelect"><option value="">+ New song</option></select></label></div><form id="songForm"><div class="form-grid"><label>Title / Hla hming<input name="title" required></label><label>Lyricist / Phuahtu<input name="lyricist" required></label><label>Singer / Satu<input name="singer" required></label><label>Category<input name="category" value="Other"></label><label>Date added<input name="dateAdded" type="date"></label><label>Views<input name="views" type="number" min="0" value="0"></label></div><label>Lyrics / Hla thu<textarea name="lyricsText" rows="16" placeholder="[Verse 1]&#10;Line 1&#10;Line 2&#10;&#10;[Chorus]&#10;Line 1"></textarea></label><p class="hint">Use headings like [Verse 1], [Verse 2] and [Chorus].</p><div class="form-actions"><button type="submit">Save song</button><button class="button ghost" id="resetBtn" type="button">Clear</button><button class="button danger" id="deleteBtn" type="button" disabled>Delete</button></div><div id="adminMessage" class="message"></div></form></section></main><script src="/admin.js"></script></body></html>
